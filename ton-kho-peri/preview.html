<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var t=localStorage.getItem("peri_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Tồn kho NCC Peripherals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for the Peri buying team, dense and exact
   IDEA a warehouse stock board: one row per SKU, supplier counts per warehouse
   PICTURE the live SKU table itself, headed by a strip of supplier sheets with stock bars
   COLOUR white ground, near-black ink, GEARVN red field and accent, amber for low stock
   TYPE Geist 600 titles + Geist text, tabular figures in columns
   LAYOUT red title strip, source strip, figures row, toolbar, table; stacks under 600px */
:root{color-scheme:light dark;--bg:light-dark(#fff,#082f68);--ink:light-dark(#121214,#f2f7ff);--mute:light-dark(#62636b,#c3d6f2);--line:light-dark(#e4e4e9,#2d5e9e);--soft:light-dark(#f5f5f7,#0e3c80);--red:light-dark(#d70018,#ff4157);--amber:light-dark(#a8530a,#f5a524);--strip:#d70018}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:0.9375rem/1.5 Geist,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:82.5rem;margin:0 auto;padding-inline:clamp(1rem,3vw,4.5rem)}
header{background:light-dark(#fff,#16171c);color:var(--ink);border-bottom:1px solid var(--line);overflow:hidden}
header .wrap{position:relative;display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:0.5rem 4rem;padding-block:0.875rem}
.htxt{display:flex;flex-direction:column;gap:1rem;flex:0 1 auto;padding-left:6.3125rem;padding-top:1.5rem}
.ladder{position:absolute;left:calc(clamp(1rem,3vw,4.5rem) + 10px);top:0;height:100%;max-height:270px;width:auto;pointer-events:none;z-index:1}
.hero{flex:0 1 23.75rem;min-width:12rem;display:flex;justify-content:center}.hero img{display:block;width:100%;max-width:23.75rem;height:auto}
@media(min-width:58.0625rem){header h1{white-space:nowrap}header .wrap{min-height:17rem}}
@media(max-width:58rem){header .wrap{flex-direction:column-reverse;align-items:stretch}.htxt{padding-left:0;padding-top:0}.ladder{top:.75rem;height:clamp(8rem,30vw,13rem);max-height:none}.hero{align-self:flex-end;flex:none;width:min(18.75rem,58%);min-width:0;margin-block:.5rem;min-height:clamp(8rem,30vw,13rem);align-items:center}.hero img{max-width:none}}
h1{margin:0;font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.2;letter-spacing:-.02em;font-weight:600}
header p{margin:0.5rem 0 0;color:var(--mute);font-size:0.875rem;max-width:65ch}
header .btn.theme{background:transparent;color:var(--ink);border:1px solid var(--line);display:inline-flex;align-items:center;gap:0.5rem}header .btn.theme:hover{background:var(--soft);border-color:var(--ink)}
.hbtn{display:flex;align-items:center;gap:1rem;font-size:0.8125rem}
button,select,input{font:inherit;color:inherit}
.btn{min-height:2.5rem;padding:0 1.0667em;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
header .btn{background:#d70018;color:#fff;border:0}header .btn:hover{background:#b80015}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.125rem,1fr));gap:1rem;padding-block:1.125rem}
.sc{--c:#cdeb78;--m:#effac9;position:relative;overflow:hidden;border:0;border-radius:22px;padding:0.875rem 1rem 0.875rem;background:var(--c);color:#14163a;text-align:left;cursor:pointer;display:grid;gap:0.5rem;min-height:9.25rem;align-content:start;transition:transform .15s ease,box-shadow .15s ease}
.sc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,22,58,.14)}
.sc.on{box-shadow:0 0 0 3px #14163a}
.sc.k1{--c:#f3a0e2;--m:#e04fc6}.sc.k2{--c:#9aaef9;--m:#cdeb78}.sc.k3{--c:#b8eedb;--m:#fff3a3}
.sc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem}
.sc b{font-family:Fredoka,Geist,system-ui,sans-serif;font-weight:600;font-size:1.0625rem;line-height:1.2;letter-spacing:0}
.sc a{flex:none;font-size:0.75rem;font-weight:600;color:#14163a;text-decoration:none;background:rgba(255,255,255,.6);border-radius:999px;padding:0.2em 0.6667em}
.sc a:hover{background:#fff}
.sc small{color:rgba(20,22,58,.72);font-size:0.7812rem;display:block}
.sc .big{font-family:Fredoka,Geist,system-ui,sans-serif;font-weight:600;font-size:1.875rem;line-height:1.2;margin-top:0.5rem}
.sc .big span{font-size:0.875rem;font-weight:500;margin-left:0.5rem}
.sc .bar,.sc small.sum{margin-right:6rem}
.sc .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.5)}
.sc .bar .i-in{background:#14163a}.sc .bar .i-low{background:#f59e0b}.sc .bar .i-out{background:#e5484d}.sc .bar .i-na{background:rgba(255,255,255,.85)}
.sc .err{color:#9b0718;margin-right:6rem}
.sc img.stk{position:absolute;right:8px;bottom:6px;width:auto;height:auto;max-width:96px;max-height:92px;pointer-events:none;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 4px rgba(20,22,58,.18))}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.i-in{background:var(--ink)}.i-low{background:var(--amber)}.i-out{background:var(--red)}.i-na{background:var(--line)}
.err{color:var(--red);font-size:0.7812rem}
.kpi[hidden]{display:none}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi button{background:var(--bg);border:0;padding:0.8em 0.9333em;text-align:left;cursor:pointer}
.kpi button:hover,.kpi button.on{background:var(--soft)}
.kpi strong{display:block;font-size:clamp(1.5rem,3vw,2rem);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:0.8125rem;color:var(--mute)}
.kpi .alert strong{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;padding-block:1rem 0.625rem}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{min-height:2.5rem;padding:0 0.9333em;border:0;background:var(--bg);cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
input[type=search]{min-height:2.5rem;font-size:1rem;padding:0 0.75rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);flex:1 1 13.75rem}
select{min-height:2.5rem;padding:0 0.5333em;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:0.875rem}
label.ck{display:flex;gap:0.5rem;align-items:center;font-size:0.8438rem;color:var(--mute);white-space:nowrap}
.note{font-size:0.8125rem;color:var(--mute);margin:0 0 0.5rem;max-width:65ch}
.scroll{overflow-x:auto;border-top:2px solid var(--ink)}
table{width:100%;border-collapse:collapse}
th{font-size:0.7812rem;color:var(--mute);font-weight:500;text-align:left;padding:0.5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:0.5625rem 0.5rem;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:600}
.sku{font-weight:600;font-size:0.8125rem;overflow-wrap:anywhere}
.nm{font-size:0.875rem}
.meta{font-size:0.7812rem;color:var(--mute)}
.m{font-size:0.8125rem;display:flex;flex-wrap:wrap;gap:0.5rem 0.5rem;padding:0.0625rem 0}
.m b{font-weight:600}
.m .q{font-variant-numeric:tabular-nums;white-space:nowrap}
.fz{font-size:0.75rem;border:1px dashed var(--amber);color:var(--amber);border-radius:4px;padding:0 0.2667em}
.pill{display:inline-block;font-size:0.75rem;font-weight:600;padding:0.1333em 0.5333em;border-radius:999px;white-space:nowrap}
.p-in{background:var(--soft);color:var(--ink)}.p-low{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}.p-out{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.p-na{color:var(--mute);border:1px solid var(--line)}.p-nomatch{color:var(--mute);border:1px dashed var(--line)}
tr.al td:first-child{box-shadow:inset 3px 0 var(--red)}
.zero{color:var(--red)}
.more{margin:1rem 0 2.5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(18.125rem,1fr));gap:1rem}
.pc{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:0.875rem 1rem 0.875rem 1.125rem;background:var(--bg);display:flex;flex-direction:column;gap:0.5rem}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--line))}
.pc.s-in{--acc:#2f9e6b}.pc.s-low{--acc:var(--amber)}.pc.s-out{--acc:var(--red)}
.pc h3{margin:0;font-size:0.9375rem;font-weight:600;line-height:1.3}
.pc .tag{font-size:0.7812rem;color:var(--mute);overflow-wrap:anywhere}
.pc .nl{display:grid;gap:0.5rem;margin-top:0.5rem}
.pc .nr{display:flex;align-items:center;flex-wrap:wrap;gap:0.5rem 1rem;padding:0.5rem 0.625rem;border-radius:10px;background:var(--soft)}
.pc .nl .nr{display:grid;grid-template-columns:minmax(4.6em,auto) 1fr auto;flex-wrap:nowrap}.pc .qs{display:flex;gap:0.5rem 1rem;flex-wrap:wrap}
.pc .nr b{font-weight:600;font-size:0.8438rem;min-width:5.5em}
.chip{font-size:0.7812rem;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}.chip strong{color:var(--ink);font-weight:600;font-size:0.875rem;margin-left:0.5rem}.chip strong.zero{color:var(--red)}
.pc .nr .pill{margin-left:auto;justify-self:end}
.pc .nl{margin-top:auto}.pc>.nr{margin-top:auto}.pc .nl .nr{grid-template-columns:6.4em 1fr auto}
.cards .empty{grid-column:1/-1}
.pc{--pt:#0f1130;--pm:rgba(15,17,48,.86);color:var(--pt);border:0;box-shadow:0 1px 3px rgba(20,22,58,.12)}
.pc h3,.pc .tag{text-shadow:0 0 2px var(--pbg),0 0 4px var(--pbg),0 0 8px var(--pbg),0 0 14px var(--pbg)}
.pc h3{font-weight:700;font-size:0.9688rem}
.pc .tag{font-weight:500;font-size:0.8125rem}
.pc .tag{color:var(--pm)}
.pc .gv{font-size:0.8438rem;font-weight:700;color:var(--pt);overflow-wrap:anywhere;text-shadow:0 0 2px var(--pbg),0 0 4px var(--pbg),0 0 8px var(--pbg)}.pc .gv i{font-weight:500;font-style:normal;color:var(--pm)}
.pc .nb{display:inline-block;font-size:0.75rem;font-weight:700;padding:0.1333em 0.6667em;border-radius:999px;color:var(--pt);background:color-mix(in srgb,var(--pbg) 70%,transparent);border:1.5px dashed color-mix(in srgb,var(--pt) 55%,transparent)}
.pc[class*=bp]{background-color:var(--pbg);background-image:linear-gradient(180deg,color-mix(in srgb,var(--pbg) 96%,transparent) 0,color-mix(in srgb,var(--pbg) 85%,transparent) 40%,transparent 70%),var(--pat)}

      return `<article class="pc s-${i.state} bp${bp(i.src.brand)}"><h3>${esc(i.name)}</h3>${i.gvnAll.length?`<div class="gv">${i.gvnAll.map(g=>`GVN: ${esc(g.name||g.sku)}${g.live?'':` <i>(${esc(g.status||'không có tình trạng')})</i>`}`).join('<br>')}</div>`:'<div><span class="nb">Chưa kinh doanh</span></div>'}<div class="tag">${esc(i.src.ncc)} · ${esc(i.src.brand)}${i.group?' · '+esc(i.group):''}${i.note?' · '+esc(i.note):''}</div><div class="tag">Mã: ${esc([i.code,i.mvt].filter(Boolean).join(' · ')||'—')}</div><div class="nr">${chip('HCM',h,h==='0')}${chip('HN',n,n==='0')}${i.price?chip('Giá',money(i.price)):''}${pill(i.state)}</div></article>`;}).join('');
  }
  if(!rows.length)$('cards').innerHTML=`<div class="empty">${loading?'Đang tải dữ liệu từ Google Sheet…':'Không có sản phẩm nào khớp bộ lọc.'}</div>`;
  $('more').innerHTML=total>S.limit?`<button class="btn" id="mo">Xem thêm ${fmt(Math.min(200,total-S.limit))} ${isSku?'sản phẩm':'dòng'} (còn ${fmt(total-S.limit)})</button>`:'';
  if($('mo'))$('mo').onclick=()=>{S.limit+=200;render();};
  if($('clrsrc'))$('clrsrc').onclick=e=>{e.preventDefault();S.src='';render();};
  S.rows=rows;
};
const set=(k,v)=>{S[k]=v;S.limit=200;render();};
$('q').oninput=e=>set('q',e.target.value);$('fn').onchange=e=>set('ncc',e.target.value);$('fb').onchange=e=>set('brand',e.target.value);$('fs').onchange=e=>set('st',e.target.value);
const view=v=>{S.view=v;S.st='';S.brand='';S.limit=200;try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);}catch(e){}render();};
$('t-sku').onclick=()=>view('sku');$('t-ncc').onclick=()=>view('ncc');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='sku'||h==='ncc')view(h);});
$('kpi').onclick=e=>{const b=e.target.closest('button');if(b)set('st',S.st===b.dataset.st?'':b.dataset.st);};
$('src').onclick=e=>{if(e.target.closest('a'))return;const c=e.target.closest('.sc');if(c){S.src=S.src===c.dataset.src?'':c.dataset.src;if(S.src&&S.view==='sku'&&!gvn.some(g=>g.inScope&&g.m.some(x=>x.it.src.id===S.src)))S.view='ncc';S.limit=200;render();}};
$('src').onkeydown=e=>{if(e.key==='Enter')$('src').onclick(e);};
$('refresh').onclick=async()=>{if(gas){if(S.needPin)return;loadGas(true);return;}if(!mcp)return;SOURCES.concat(GVN).forEach(s=>data[s.id].state=data[s.id].rows?'ok':'loading');$('upd').textContent='Đang làm mới…';try{await mcp.invalidate('Google Sheets');}catch(e){}};

const h0=location.hash.slice(1);if(h0==='ncc')S.view='ncc';
render();
if(gas){loadGas(false);}
else if(window.claude&&window.claude.use){window.claude.use('mcp').then(m=>{mcp=m;if(!mcp){SOURCES.concat(GVN).forEach(s=>data[s.id].state='err');render();return;}watch();render();}).catch(()=>{render();});}
else{SOURCES.concat(GVN).forEach(s=>data[s.id].state='err');render();}
})();
</script>

<script>(()=>{const r=document.documentElement,b=document.getElementById('theme'),mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};const cur=()=>r.dataset.theme||(mq.matches?'dark':'light');const lab=()=>{const d=cur()==='dark';b.innerHTML=d?'☀️ Sáng':'🌙 Tối';b.title=d?'Chuyển sang giao diện sáng':'Chuyển sang giao diện tối';b.setAttribute('aria-label',b.title);};b.onclick=()=>{const n=cur()==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('peri_theme',n)}catch(e){}lab();};mq.addEventListener&&mq.addEventListener('change',lab);lab();})();</script>
