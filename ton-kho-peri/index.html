<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tồn kho NCC Peri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for the Peri buying team, dense and exact
   IDEA a warehouse stock board: one row per SKU, supplier counts per warehouse
   PICTURE the live SKU table itself, headed by a strip of supplier sheets with stock bars
   COLOUR white ground, near-black ink, GEARVN red field and accent, amber for low stock
   TYPE Geist 600 titles + Geist text, tabular figures in columns
   LAYOUT red title strip, source strip, figures row, toolbar, table; stacks under 600px */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e10);--ink:light-dark(#121214,#ececee);--mute:light-dark(#62636b,#9c9ca6);--line:light-dark(#e4e4e9,#28282e);--soft:light-dark(#f5f5f7,#17171b);--red:light-dark(#d70018,#ff4157);--amber:light-dark(#a8530a,#f5a524);--strip:#d70018}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1320px;margin:0 auto;padding-inline:max(3vw,16px)}
header{background:#fff;color:#121214;border-bottom:1px solid #e4e4e9}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-block:14px}
.htxt{display:flex;flex-direction:column;gap:14px;flex:1 1 300px}
.hero{flex:0 1 380px;display:flex;justify-content:center}.hero img{display:block;width:100%;max-width:380px;height:auto}
@media(max-width:600px){header .wrap{flex-direction:column-reverse;align-items:stretch}.hero img{max-width:300px;margin-inline:auto}}
h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.02em;font-weight:600}
header p{margin:4px 0 0;color:#62636b;font-size:14px}
.hbtn{display:flex;align-items:center;gap:12px;font-size:13px}
button,select,input{font:inherit;color:inherit}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
header .btn{background:#d70018;color:#fff;border:0}header .btn:hover{background:#b80015}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-block:18px}
.sc{--c:#cdeb78;--m:#effac9;position:relative;overflow:hidden;border:0;border-radius:22px;padding:14px 16px 14px;background:var(--c);color:#14163a;text-align:left;cursor:pointer;display:grid;gap:8px;min-height:148px;align-content:start;transition:transform .15s ease,box-shadow .15s ease}
.sc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,22,58,.14)}
.sc.on{box-shadow:0 0 0 3px #14163a}
.sc.k1{--c:#f3a0e2;--m:#e04fc6}.sc.k2{--c:#9aaef9;--m:#cdeb78}.sc.k3{--c:#b8eedb;--m:#fff3a3}
.sc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sc b{font-family:Fredoka,Geist,system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.15;letter-spacing:0}
.sc a{flex:none;font-size:12px;font-weight:600;color:#14163a;text-decoration:none;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 10px}
.sc a:hover{background:#fff}
.sc small{color:rgba(20,22,58,.72);font-size:12.5px;display:block}
.sc .big{font-family:Fredoka,Geist,system-ui,sans-serif;font-weight:600;font-size:30px;line-height:1;margin-top:2px}
.sc .big span{font-size:14px;font-weight:500;margin-left:4px}
.sc .bar,.sc small.sum{margin-right:96px}
.sc .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.5)}
.sc .bar .i-in{background:#14163a}.sc .bar .i-low{background:#f59e0b}.sc .bar .i-out{background:#e5484d}.sc .bar .i-na{background:rgba(255,255,255,.85)}
.sc .err{color:#9b0718;margin-right:96px}
.sc img.stk{position:absolute;right:8px;bottom:6px;width:auto;height:auto;max-width:96px;max-height:92px;pointer-events:none;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 4px rgba(20,22,58,.18))}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.i-in{background:var(--ink)}.i-low{background:var(--amber)}.i-out{background:var(--red)}.i-na{background:var(--line)}
.err{color:var(--red);font-size:12.5px}
.kpi[hidden]{display:none}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi button{background:var(--bg);border:0;padding:12px 14px;text-align:left;cursor:pointer}
.kpi button:hover,.kpi button.on{background:var(--soft)}
.kpi strong{display:block;font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--mute)}
.kpi .alert strong{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:16px 10px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{min-height:40px;padding:0 14px;border:0;background:var(--bg);cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
input[type=search]{min-height:40px;font-size:16px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);flex:1 1 220px}
select{min-height:40px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
label.ck{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--mute);white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin:0 0 8px}
.scroll{overflow-x:auto;border-top:2px solid var(--ink)}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;color:var(--mute);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:600}
.sku{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.nm{font-size:14px}
.meta{font-size:12.5px;color:var(--mute)}
.m{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;padding:1px 0}
.m b{font-weight:600}
.m .q{font-variant-numeric:tabular-nums;white-space:nowrap}
.fz{font-size:11.5px;border:1px dashed var(--amber);color:var(--amber);border-radius:4px;padding:0 4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-in{background:var(--soft);color:var(--ink)}.p-low{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}.p-out{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.p-na{color:var(--mute);border:1px solid var(--line)}.p-nomatch{color:var(--mute);border:1px dashed var(--line)}
tr.al td:first-child{box-shadow:inset 3px 0 var(--red)}
.zero{color:var(--red)}
.more{margin:14px 0 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pc{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 18px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--line))}
.pc.s-in{--acc:#2f9e6b}.pc.s-low{--acc:var(--amber)}.pc.s-out{--acc:var(--red)}
.pc h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.pc .tag{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.pc .nl{display:grid;gap:6px;margin-top:2px}
.pc .nr{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.pc .nl .nr{display:grid;grid-template-columns:minmax(4.6em,auto) 1fr auto;flex-wrap:nowrap}.pc .qs{display:flex;gap:4px 12px;flex-wrap:wrap}
.pc .nr b{font-weight:600;font-size:13.5px;min-width:5.5em}
.chip{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}.chip strong{color:var(--ink);font-weight:600;font-size:14px;margin-left:4px}.chip strong.zero{color:var(--red)}
.pc .nr .pill{margin-left:auto;justify-self:end}
.cards .empty{grid-column:1/-1}
.pc{--pt:#0f1130;--pm:rgba(15,17,48,.86);color:var(--pt);border:0;box-shadow:0 1px 3px rgba(20,22,58,.12)}
.pc h3,.pc .tag{text-shadow:0 0 2px var(--pbg),0 0 4px var(--pbg),0 0 8px var(--pbg),0 0 14px var(--pbg)}
.pc h3{font-weight:700;font-size:15.5px}
.pc .tag{font-weight:500;font-size:13px}
.pc .tag{color:var(--pm)}
.pc .gv{font-size:13.5px;font-weight:700;color:var(--pt);overflow-wrap:anywhere;text-shadow:0 0 2px var(--pbg),0 0 4px var(--pbg),0 0 8px var(--pbg)}.pc .gv i{font-weight:500;font-style:normal;color:var(--pm)}
.pc .nb{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:var(--pt);background:color-mix(in srgb,var(--pbg) 70%,transparent);border:1.5px dashed color-mix(in srgb,var(--pt) 55%,transparent)}
.pc[class*=bp]{background-color:var(--pbg);background-image:linear-gradient(180deg,color-mix(in srgb,var(--pbg) 96%,transparent) 0,color-mix(in srgb,var(--pbg) 85%,transparent) 40%,transparent 70%),var(--pat)}

='220.0,284.0 224.2,294.2 235.2,295.1 226.8,302.2 229.4,312.9 220.0,307.2 210.6,312.9 213.2,302.2 204.8,295.1 215.8,294.2' fill='%23c8302a'/%3E%3C/svg%3E")}

const API=window.PERI_API||'';const gas=!!(window.google&&google.script&&google.script.run)||!!API;

const PINK='peri_pin';const getPin=()=>{try{return localStorage.getItem(PINK)||''}catch(e){return S.pin||''}};const setPin=v=>{S.pin=v;try{v?localStorage.setItem(PINK,v):localStorage.removeItem(PINK)}catch(e){}};

  callData(force,getPin(),res=>{if(res&&res.pinError){setPin('');askPin(res.locked?'Nhập sai quá nhiều lần. Thử lại sau 10 phút.':'Mã PIN không đúng.');return;}SOURCES.concat(GVN).forEach(s=>{const d=data[s.id],r=res&&res[s.id];if(r&&r.rows){d.rows=r.rows;d.state='ok';d.err='';d.at=r.at||res.at;}else{d.err=(r&&r.error)||'Không đọc được sheet';d.state=d.rows?'stale':'err';}});recompute();},
  e=>{SOURCES.concat(GVN).forEach(s=>{const d=data[s.id];d.err='Lỗi tải: '+((e&&e.message)||e);d.state=d.rows?'stale':'err';});recompute();});};
const counts=arr=>{const c={in:0,low:0,out:0,na:0,nomatch:0};arr.forEach(x=>c[x.state]++);return c;};

};
const fillSel=(id,label,vals,cur)=>{$(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('');};
const qmatch=(q,...f)=>!q||f.some(x=>hnorm(x).includes(q));
const rowsSku=()=>{
  const q=hnorm(S.q);let r=[];
  for(const g of gvn){if(!g.inScope)continue;
    if(g.m.length)g.m.forEach(({it})=>r.push({g,it,name:g.name,ncc:it.src.ncc,total:it.total,state:it.state}));
    else r.push({g,it:null,name:g.name,ncc:g.npp,total:null,state:'nomatch'});}
  const allR=r;
  if(S.brand)r=r.filter(x=>hnorm(x.g.brand)===hnorm(S.brand));
  if(S.ncc)r=r.filter(x=>hnorm(x.ncc).includes(hnorm(S.ncc)));
  if(S.src)r=r.filter(x=>x.it&&x.it.src.id===S.src);
  const base=r;
  if(S.st)r=r.filter(x=>x.state===S.st);
  r=r.filter(x=>qmatch(q,x.g.name,x.g.sku,x.g.mancc,x.g.brand,x.ncc,x.it&&x.it.code,x.it&&x.it.name));
  const keep=new Set(r.map(x=>x.g));r=allR.filter(x=>keep.has(x.g));
  return {base,r};
};
const rowsNcc=()=>{
  const q=hnorm(S.q);let r=items;
  if(S.ncc)r=r.filter(i=>i.src.ncc===S.ncc);if(S.brand)r=r.filter(i=>hnorm(i.src.brand)===hnorm(S.brand));if(S.src)r=r.filter(i=>i.src.id===S.src);
  const base=r;
  if(S.st==='alert')r=r.filter(i=>i.state==='out'&&i.gvn.length);else if(S.st==='nomatch')r=r.filter(i=>!i.gvnAll.length);else if(S.st)r=r.filter(i=>i.state===S.st);
  r=r.filter(i=>qmatch(q,i.name,i.code,i.mvt,i.group,...i.gvnAll.map(g=>g.name),...i.gvnAll.map(g=>g.sku)));
  return {base,r};
};
const ORD={out:0,low:1,na:2,in:3,nomatch:4};
const sortBy=(r,isSku)=>{const t=x=>x.total==null?-1:x.total;const nm=x=>hnorm(x.name);
  const f={al:(a,b)=>ORD[a.state]-ORD[b.state]||nm(a).localeCompare(nm(b)),desc:(a,b)=>t(b)-t(a)||nm(a).localeCompare(nm(b)),asc:(a,b)=>(a.total==null?1e9:a.total)-(b.total==null?1e9:b.total),az:(a,b)=>nm(a).localeCompare(nm(b))}[S.sort];return r.slice().sort(f);};
const qv=(it,k)=>k==='hcm'&&it.hcm.v==null&&it.hn.v==null?it.qty.v:it[k].v;
const qs=(it,k)=>it[k].ok?'OK':fmt(qv(it,k));
const pill=s=>`<span class="pill p-${s}">${STL[s]}</span>`;
const q2=v=>v==null?'':`<span class="q${v.v===0?' zero':''}">${v.ok?'OK':fmt(v.v)}</span>`;
const kpi=(base,isSku)=>{const c=counts(base);
  const list=isSku?[['','Sản phẩm GVN còn hàng',new Set(base.map(x=>x.g)).size],['in','Còn hàng ở NCC',c.in],['low',`Sắp hết (≤${LOW})`,c.low],['out','Hết hàng ở NCC',c.out],['nomatch','Chưa khớp mã NCC',c.nomatch],['na','Chưa có số tồn',c.na]]
   :[['','Dòng tồn kho NCC',base.length],['in','Còn hàng',c.in],['low',`Sắp hết (≤${LOW})`,c.low],['out','Hết hàng',c.out],['alert','Hết hàng, GVN đang bán',base.filter(i=>i.state==='out'&&i.gvn.length).length],['nomatch','Chưa kinh doanh',base.filter(i=>!i.gvnAll.length).length],['na','Chưa có số tồn',c.na]];
  $('fs').innerHTML=`<option value="">Tất cả tình trạng</option>`+list.slice(1).map(([k,l,v])=>`<option value="${k}"${S.st===k?' selected':''}>${esc(l)} (${fmt(v)})</option>`).join('');
  $('kpi').innerHTML=list.map(([k,l,v])=>`<button data-st="${k}" class="${S.st===k?'on ':''}${k==='out'||k==='alert'?'alert':''}"><strong>${fmt(v)}</strong><span>${l}</span></button>`).join('');};
const render=()=>{
  gate();renderSrc();
  const ld=SOURCES.concat(GVN).filter(s=>data[s.id].at);const at=ld.length?Math.min(...ld.map(s=>data[s.id].at)):0;

  fillSel('fn','Tất cả NCC',NCCS,S.ncc);
  fillSel('fb','Tất cả hãng',[...new Set((S.view==='sku'?gvn.filter(g=>g.inScope).map(g=>g.brand):SOURCES.map(s=>s.brand)).filter(Boolean).map(b=>b.trim()))].sort((a,b)=>a.localeCompare(b)),S.brand);
    $('t-sku').classList.toggle('on',S.view==='sku');$('t-ncc').classList.toggle('on',S.view==='ncc');

  const bp=b=>{const k=String(b||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(BP[k])return BP[k];let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))%997;return 0;};
  const chip=(l,v,z)=>`<span class="chip">${l}<strong class="${z?'zero':''}">${v}</strong></span>`;
  if(isSku){

      return `<article class="pc s-${i.state} bp${bp(i.src.brand)}"><h3>${esc(i.name)}</h3>${i.gvnAll.length?`<div class="gv">${i.gvnAll.map(g=>`GVN: ${esc(g.name||g.sku)}${g.live?'':` <i>(${esc(g.status||'không có tình trạng')})</i>`}`).join('<br>')}</div>`:'<div><span class="nb">Chưa kinh doanh</span></div>'}<div class="tag">${esc(i.src.ncc)} · ${esc(i.src.brand)}${i.group?' · '+esc(i.group):''}${i.note?' · '+esc(i.note):''}</div><div class="nr">${chip('HCM',h,h==='0')}${chip('HN',n,n==='0')}${i.price?chip('Giá',money(i.price)):''}${pill(i.state)}</div><div class="tag">Mã: ${esc([i.code,i.mvt].filter(Boolean).join(' · ')||'—')}</div></article>`;}).join('');
  }
  if(!rows.length)$('cards').innerHTML=`<div class="empty">${loading?'Đang tải dữ liệu từ Google Sheet…':'Không có sản phẩm nào khớp bộ lọc.'}</div>`;
  $('more').innerHTML=total>S.limit?`<button class="btn" id="mo">Xem thêm ${fmt(Math.min(200,total-S.limit))} ${isSku?'sản phẩm':'dòng'} (còn ${fmt(total-S.limit)})</button>`:'';
