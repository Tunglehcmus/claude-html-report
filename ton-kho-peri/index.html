<style>
/* VOICE work tool for the Peri buying team, dense and exact

:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e10);--ink:light-dark(#121214,#ececee);--mute:light-dark(#62636b,#9c9ca6);--line:light-dark(#e4e4e9,#28282e);--soft:light-dark(#f5f5f7,#17171b);--red:light-dark(#d70018,#ff4157);--amber:light-dark(#a8530a,#f5a524);--strip:#d70018}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1320px;margin:0 auto;padding-inline:max(3vw,16px)}

.htxt{display:flex;flex-direction:column;gap:14px;flex:1 1 300px}
.hero{flex:0 1 380px;display:flex;justify-content:center}.hero img{display:block;width:100%;max-width:380px;height:auto}
@media(max-width:600px){header .wrap{flex-direction:column-reverse;align-items:stretch}.hero img{max-width:300px;margin-inline:auto}}
h1{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.02em;font-weight:600}
header p{margin:4px 0 0;color:#62636b;font-size:14px}
.hbtn{display:flex;align-items:center;gap:12px;font-size:13px}
button,select,input{font:inherit;color:inherit}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
header .btn{background:#d70018;color:#fff;border:0}header .btn:hover{background:#b80015}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-block:18px}
.sc{--c:#cdeb78;--m:#effac9;position:relative;overflow:hidden;border:0;border-radius:22px;padding:14px 16px 14px;background:var(--c);color:#14163a;text-align:left;cursor:pointer;display:grid;gap:8px;min-height:148px;align-content:start;transition:transform .15s ease,box-shadow .15s ease}
.sc:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,22,58,.14)}
.sc.on{box-shadow:0 0 0 3px #14163a}
.sc.k1{--c:#f3a0e2;--m:#e04fc6}.sc.k2{--c:#9aaef9;--m:#cdeb78}.sc.k3{--c:#b8eedb;--m:#fff3a3}
.sc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sc b{font-family:Fredoka,Geist,system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.15;letter-spacing:0}
.sc a{flex:none;font-size:12px;font-weight:600;color:#14163a;text-decoration:none;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 10px}
.sc a:hover{background:#fff}
.sc small{color:rgba(20,22,58,.72);font-size:12.5px;display:block}
.sc .big{font-family:Fredoka,Geist,system-ui,sans-serif;font-weight:600;font-size:30px;line-height:1;margin-top:2px}
.sc .big span{font-size:14px;font-weight:500;margin-left:4px}
.sc .bar,.sc small.sum{margin-right:62px}
.sc .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.5)}
.sc .bar .i-in{background:#14163a}.sc .bar .i-low{background:#f59e0b}.sc .bar .i-out{background:#e5484d}.sc .bar .i-na{background:rgba(255,255,255,.85)}
.sc .err{color:#9b0718;margin-right:62px}
.sc svg.mas{position:absolute;right:-4px;bottom:-8px;width:74px;height:74px;pointer-events:none}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.i-in{background:var(--ink)}.i-low{background:var(--amber)}.i-out{background:var(--red)}.i-na{background:var(--line)}
.err{color:var(--red);font-size:12.5px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi button{background:var(--bg);border:0;padding:12px 14px;text-align:left;cursor:pointer}
.kpi button:hover,.kpi button.on{background:var(--soft)}
.kpi strong{display:block;font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--mute)}
.kpi .alert strong{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:16px 10px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}

label.ck{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--mute);white-space:nowrap}
.note{font-size:13px;color:var(--mute);margin:0 0 8px}
.scroll{overflow-x:auto;border-top:2px solid var(--ink)}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;color:var(--mute);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font-weight:600}
.sku{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.nm{font-size:14px}
.meta{font-size:12.5px;color:var(--mute)}
.m{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 10px;padding:1px 0}
.m b{font-weight:600}
.m .q{font-variant-numeric:tabular-nums;white-space:nowrap}
.fz{font-size:11.5px;border:1px dashed var(--amber);color:var(--amber);border-radius:4px;padding:0 4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-in{background:var(--soft);color:var(--ink)}.p-low{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}.p-out{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.p-na{color:var(--mute);border:1px solid var(--line)}.p-nomatch{color:var(--mute);border:1px dashed var(--line)}
tr.al td:first-child{box-shadow:inset 3px 0 var(--red)}
.zero{color:var(--red)}
.more{margin:14px 0 40px}
.empty{padding:40px 0;color:var(--mute);text-align:center}
.gate{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
@media(max-width:600px){.src{display:flex;overflow-x:auto;gap:10px;padding-block:12px;scroll-snap-type:x mandatory}.sc{flex:0 0 210px;scroll-snap-align:start}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--mute);font-size:12.5px;font-weight:400;text-align:left}.stack td.w{display:block;text-align:left}.stack td.w::before{display:none}tr.al td:first-child{box-shadow:none}tr.al{box-shadow:inset 3px 0 var(--red);padding-left:8px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="htxt"><div><h1>Tồn kho NCC · Peri</h1><p>Mã GEARVN đang kinh doanh đối chiếu tồn kho HCM / HN của nhà cung cấp. Số liệu chỉ cập nhật khi bấm "Làm mới".</p></div>

</div></header>
<main class="wrap">

</main>
<script>window.PERI_API='https://script.google.com/macros/s/AKfycbzt4cp1XfLXDw8VNBwHLSwd3URQjgibUBclVDCDChT27hNAMZSVHx-oPtiqULHUfEbH/exec';</script>
<script>window.onerror=function(m,s,l,c){var g=document.getElementById('gate');if(g)g.innerHTML='<div class="gate"><span class="err">Lỗi trang: '+String(m).replace(/</g,'&lt;')+' (dòng '+l+':'+c+')</span></div>';};</script>
<script>
(()=>{
const SID={logi:'1lfgrXbm_jj073s29us2M3dUftn8D2FW4fEJLedPzrP0',atk:'1n7pGGfcXhtcfxxThOAYD2se8Zh1_CUcd4zZLrt7U18c',mh:'1w_ndsYa7dLGi9CndRX8lPOzeJVr7wT90KVywReAdWDo',vasus:'1M5By9120T5bZ1eP54B9KOGZ4q_Q61kWoGvrQWG_B9Bk',vrazer:'125jikvCtFzS66twLf4umZyBpRFIeElrW8z_Jfd-YkHM',dasus:'1y5ZKiw_uBv1rij_mB242DPvXka6-DCGw6XrOGvGWfjw',gvn:'1wm3Ytp13IHS5R6LQ07wfvGgMeyovRaseArxxSrM0_cc'};
const SOURCES=[
 {id:'dgw-logi',ncc:'DGW',brand:'Logitech',sid:SID.logi,tab:'TỒN KHO',cols:'A1:J2500',gid:91559644},
 {id:'dgw-asus',ncc:'DGW',brand:'Asus',sid:SID.dasus,tab:'TỒN KHO',cols:'A1:N2500',gid:1055861893,mul:1000},
 {id:'vsc-asus',ncc:'VSC',brand:'Asus',sid:SID.vasus,tab:'TỒN KHO',cols:'A1:J2500',gid:718291458},
 {id:'vsc-razer',ncc:'VSC',brand:'Razer',sid:SID.vrazer,tab:' tồn kho RAZER',cols:'A1:H2500',gid:780734675},
 {id:'lk-atk',ncc:'Linh Kiệt',brand:'ATK',sid:SID.atk,tab:'Map Mã',cols:'A1:H2500',gid:118821521,hcmOnly:true,mapByGvn:true},
 {id:'mh-dareu',ncc:'Mai Hoàng',brand:'DAREU',sid:SID.mh,tab:'TỒN KHO DAREU',cols:'A1:G2500',gid:741525144},
 {id:'mh-akko',ncc:'Mai Hoàng',brand:'AKKO',sid:SID.mh,tab:'TỒN KHO AKKO',cols:'A1:F2500',gid:966503420},
 {id:'mh-warrior',ncc:'Mai Hoàng',brand:'Warrior',sid:SID.mh,tab:'TỒN KHO WARRIOR',cols:'A1:F2500',gid:1663328221},
 {id:'mh-rapoo',ncc:'Mai Hoàng',brand:'Rapoo',sid:SID.mh,tab:'TỒN KHO RAPOO',cols:'A1:F2500',gid:1499542568}];
const GVN={id:'gvn',sid:SID.gvn,tab:'Báo Giá SP Peri',cols:'A1:M4000',gid:696525776};
const NCCS=['DGW','VSC','Linh Kiệt','Mai Hoàng'];
const LOW=5;
/*LOGIC-START*/
const hnorm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/\s+/g,' ').trim();
const ck=s=>hnorm(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const nk=s=>hnorm(s).replace(/[^a-z0-9]+/g,' ').trim();
const FIELD={name:[/^ten (san pham|hang)/,/^ten sp ton kho/,/^model/,/san pham gearvn/],code:[/part number/,/^p\/n$/,/^id code$/,/^ma hang$/],mvt:[/^ma vat tu$/,/^mvt$/],hcm:[/hcm/],hn:[/(^|[^a-z])hn([^a-z]|$)/,/ha noi/],qty:[/^ton kho$/],price:[/gia nhap/,/gia (xuat )?gvn|gvnq/,/^gia/],note:[/ghi chu/,/^note$/],sku:[/sku gearvn/,/^sku gvn$/],gvnname:[/^ten sp gearvn$/]};
const ALLRE=Object.values(FIELD).flat();
const detect=rows=>{
  const col={},rowOf={},lim=Math.min(rows.length,7);
  for(const f in FIELD){outer:for(const re of FIELD[f])for(let r=0;r<lim;r++){const row=rows[r]||[];for(let c=0;c<row.length;c++){const t=hnorm(row[c]);if(t&&t.length<40&&re.test(t)){col[f]=c;rowOf[f]=r;break outer;}}}}
  const core=['name','hcm','hn','code','price','qty'].filter(f=>f in rowOf).map(f=>rowOf[f]);
  const end=core.length?Math.max(...core):0;let date='';
  for(let r=0;r<=Math.min(end+1,rows.length-1);r++)for(const v of rows[r]||[]){const m=hnorm(v).match(/^(?:ton[^0-9]*)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(m&&!date)date=m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+(m[3]?'/'+m[3]:'');}
  return {col,start:end+1,end,date,ok:'name' in col};
};
const pq=s=>{s=String(s??'').trim();if(!s)return{v:null};const t=hnorm(s);if(/^-+$/.test(t)||t==='het'||t==='het hang')return{v:0};if(t==='ok'||t==='co'||t==='co hang')return{v:null,ok:true};const d=s.replace(/[\s,.]/g,'');if(/^-?\d+$/.test(d))return{v:+d};return{v:null,t:s};};
const pp=s=>{const d=String(s??'').replace(/[\s,.đ₫]/g,'');return /^\d+$/.test(d)?+d:null;};
const hasL=s=>/[a-zà-ỹ]/i.test(s);
const parseSource=(src,rows)=>{
  const D=detect(rows),items=[];if(!D.ok)return{items,date:D.date,bad:true};
  const first=String((rows[D.end]||[])[0]??'').trim();let group=first&&hasL(first)&&!ALLRE.some(re=>re.test(hnorm(first)))?first:'';
  for(let r=D.start;r<rows.length;r++){
    const row=rows[r]||[],get=f=>D.col[f]==null?'':String(row[D.col[f]]??'').trim();
    let name=get('name');const code=get('code'),mvt=get('mvt'),sku=get('sku'),hs=get('hcm'),ns=get('hn'),price=get('price'),note=get('note');
    const qs=D.col.qty!=null&&D.col.qty!==D.col.hcm&&D.col.qty!==D.col.hn?get('qty'):'';
    const gvnname=get('gvnname');if(D.col.gvnname!=null&&!gvnname)continue;
    const has=code||mvt||price||hs||ns||qs||(sku&&sku!=='0');
    if(!name&&/\d/.test(code))name=code;
    if(!name){const t=row.map(x=>String(x??'').trim()).find(x=>x&&hasL(x)&&!x.startsWith('#'));if(t&&t.length<60&&!has)group=t;continue;}
    if(!has&&name.length<45&&name===name.toUpperCase()&&hasL(name)){group=name;continue;}
    if(FIELD.name.some(re=>re.test(hnorm(name))))continue;
    let hcm=pq(hs),hn=pq(ns),qty=pq(qs);if(src.hcmOnly&&!hs&&!ns&&qs){hcm=qty;hn={v:null};qty={v:null};}
    const total=hcm.v!=null||hn.v!=null?(hcm.v||0)+(hn.v||0):qty.v;
    const ok=!!(hcm.ok||hn.ok||qty.ok);
    const state=total>0||ok?(total>0&&total<=LOW&&!ok?'low':'in'):total===0?'out':'na';
    const pr=pp(price);
    items.push({src,group,name,gvnname,code,mvt,sku:sku==='0'?'':sku,hcm,hn,qty,total,ok,state,price:pr==null?null:pr*(src.mul&&pr<100000?src.mul:1),note:[note,hcm.t,hn.t,qty.t,pr==null&&price?'giá: '+price:''].filter(Boolean).join(' · '),gvn:[]});
  }
  return {items,date:D.date};
};
const parseGvn=rows=>{
  const h=(rows[0]||[]).map(hnorm),ix=k=>h.indexOf(k);
  const c={date:ix('date created'),brand:ix('brand'),sku:ix('sku'),name:ix('ten san pham'),mancc:ix('ma ncc'),retail:ix('gia ban le'),cost:ix('gia nhap'),npp:ix('npp'),status:ix('tinh trang')};
  const g=(r,k)=>c[k]<0?'':String(r[c[k]]??'').trim(),out=[];
  for(let i=1;i<rows.length;i++){const r=rows[i]||[];const sku=g(r,'sku');if(!sku)continue;out.push({sku,brand:g(r,'brand'),name:g(r,'name'),mancc:g(r,'mancc'),cost:pp(g(r,'cost')),retail:pp(g(r,'retail')),npp:g(r,'npp'),status:g(r,'status')});}
  return out;
};
const STOP=new Set('chuot ban phim tai nghe may tinh gaming khong day co mouse keyboard headset di lot cho mau va the loai wireless gear choang dau de'.split(' '));
const toks=s=>new Set(nk(s).split(' ').filter(t=>t&&!STOP.has(t)));
const jac=(a,b)=>{let i=0;for(const t of a)if(b.has(t))i++;return i/(a.size+b.size-i||1);};
const xcodes=n=>[(n.match(/^([a-z]{0,4}\d{4,}[a-z0-9-]*)\s*_/i)||[])[1],(n.match(/_\s*([a-z0-9-]{4,})\s*$/i)||[])[1]].filter(Boolean);
const brandOk=(a,b)=>{a=hnorm(a);b=hnorm(b);return !!a&&!!b&&(a===b||a.includes(b)||b.includes(a));};
const link=(gvn,items)=>{
  const I={code:new Map(),sku:new Map(),name:new Map(),gmap:new Map(),gsku:new Map()},add=(m,k,it)=>{if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(it);};
  for(const it of items){it.gvn=[];[it.code,it.mvt,...xcodes(it.name)].forEach(c=>{const k=ck(c);if(k.length>=4)add(I.code,k,it);});if(it.sku)add(I.sku,ck(it.sku),it);if(it.src.mapByGvn){if(it.gvnname)add(I.gmap,nk(it.gvnname),it);if(it.sku)add(I.gsku,ck(it.sku),it);}add(I.name,nk(it.name),it);it.tok=toks(it.name);}
  for(const g of gvn){
    const res=new Map(),put=(arr,t)=>(arr||[]).forEach(it=>{if(!res.has(it))res.set(it,t);});
    if(g.mancc){const k=ck(g.mancc);if(k.length>=4)put(I.code.get(k),'mã');put(I.name.get(nk(g.mancc)),'tên');}
    if(!res.size){put(I.gsku.get(ck(g.sku)),'SKU (Map Mã)');put(I.gmap.get(nk(g.name)),'tên GVN (Map Mã)');}
    g.m=[...res].map(([it,t])=>({it,t}));
    g.live=hnorm(g.status)==='con hang';
    if(g.live)g.m.forEach(x=>x.it.gvn.push(g.name||g.sku));
    g.inScope=g.live&&(g.m.length>0||NCCS.some(x=>hnorm(g.npp).includes(hnorm(x))));
  }
};
/*LOGIC-END*/
if(typeof window==='undefined'){module.exports={hnorm,detect,pq,parseSource,parseGvn,link,SOURCES};return;}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v==null?'—':v.toLocaleString('vi-VN');
const money=v=>v==null?'':v.toLocaleString('vi-VN')+'đ';
const STL={in:'Còn hàng',low:'Sắp hết',out:'Hết hàng',na:'Chưa có số',nomatch:'Chưa khớp mã'};
const S={view:'sku',q:'',ncc:'',brand:'',sort:'al',st:'',src:'',limit:200};
const data={};SOURCES.concat(GVN).forEach(s=>data[s.id]={state:'loading'});
let gvn=[],items=[],mcp=null;
const url=s=>`https://docs.google.com/spreadsheets/d/${s.sid}/edit#gid=${s.gid}`;

const API=window.PERI_API||'';const gas=!!(window.google&&google.script&&google.script.run)||!!API;

const fillSel=(id,label,vals,cur)=>{$(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('');};
const qmatch=(q,...f)=>!q||f.some(x=>hnorm(x).includes(q));
const rowsSku=()=>{
  const q=hnorm(S.q);let r=[];
  for(const g of gvn){if(!g.inScope)continue;

const rowsNcc=()=>{
  const q=hnorm(S.q);let r=items;

const ORD={out:0,low:1,na:2,in:3,nomatch:4};

const qv=(it,k)=>k==='hcm'&&it.hcm.v==null&&it.hn.v==null?it.qty.v:it[k].v;
